<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="10" fill="#0F1113"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6C998"/>
      <stop offset=".5" stop-color="#D4AF7A"/>
      <stop offset="1" stop-color="#B8945E"/>
    </linearGradient>
  </defs>
  <g transform="translate(32 32)">
    <!-- vertical spear -->
    <line x1="0" y1="-20" x2="0" y2="20" stroke="url(#g)" stroke-width="1.6"/>
    <!-- top diamond finial -->
    <path d="M0 -26 L3 -20 L0 -14 L-3 -20 Z" fill="url(#g)"/>
    <!-- bottom diamond finial -->
    <path d="M0 26 L3 20 L0 14 L-3 20 Z" fill="url(#g)"/>
    <!-- central ring (eclipse) -->
    <circle cx="0" cy="0" r="8" fill="none" stroke="url(#g)" stroke-width="3"/>
    <!-- crescent notches -->
    <rect x="-1.4" y="-9.6" width="2.8" height="2" fill="#0F1113"/>
    <rect x="-1.4" y="7.6" width="2.8" height="2" fill="#0F1113"/>
    <!-- side dots -->
    <circle cx="-22" cy="0" r="1.4" fill="url(#g)"/>
    <circle cx="22" cy="0" r="1.4" fill="url(#g)"/>
  </g>
</svg>
