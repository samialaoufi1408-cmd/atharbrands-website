<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">WIZAN brand identity case study</title>
  <desc id="desc">A composed showcase of the approved WIZAN preventive wellness identity: open wellness indicator, palette, digital app, report and membership system.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#07110f" flood-opacity=".34"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#91A79D" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="#0F1F1D"/>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <!-- Main cover -->
  <g filter="url(#shadow)">
    <rect x="54" y="54" width="440" height="692" rx="4" fill="#F2EFE7"/>
    <text x="92" y="106" fill="#6087A0" font-family="Arial, sans-serif" font-size="14" letter-spacing="5">CONCEPT BRAND CASE STUDY</text>

    <!-- Approved open wellness indicator -->
    <g transform="translate(274 285)">
      <path d="M-90 112 A145 145 0 1 1 90 112" fill="none" stroke="#0F1F1D" stroke-width="28" stroke-linecap="round"/>
      <path d="M-42 76 A92 92 0 0 1 -42 -76" fill="none" stroke="#91A79D" stroke-width="26" stroke-linecap="round"/>
      <path d="M42 -76 A92 92 0 0 1 42 76" fill="none" stroke="#DD776A" stroke-width="26" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="22" fill="#0F1F1D"/>
      <circle cx="96" cy="-92" r="13" fill="#6087A0"/>
    </g>

    <text x="274" y="500" text-anchor="middle" fill="#0F1F1D" font-family="Arial, sans-serif" font-weight="700" font-size="48">WIZAN</text>
    <text x="274" y="546" text-anchor="middle" fill="#0F1F1D" font-family="Arial, sans-serif" font-size="24">وِزان</text>
    <line x1="118" y1="584" x2="430" y2="584" stroke="#91A79D" stroke-opacity=".45"/>
    <text x="274" y="620" text-anchor="middle" fill="#4C6B61" font-family="Arial, sans-serif" font-size="18">عافية تُقاس. حياة تتوازن.</text>
    <text x="274" y="660" text-anchor="middle" fill="#6087A0" font-family="Arial, sans-serif" font-size="13" letter-spacing="4">STRATEGY · VERBAL · VISUAL · DIGITAL</text>
  </g>

  <!-- System board -->
  <g filter="url(#shadow)">
    <rect x="532" y="54" width="614" height="272" rx="4" fill="#F2EFE7"/>
    <text x="570" y="96" fill="#0F1F1D" font-family="Arial, sans-serif" font-weight="700" font-size="23">الاتزان في حركة</text>
    <text x="570" y="124" fill="#4C6B61" font-family="Arial, sans-serif" font-size="14">مؤشر عافية مفتوح — المعنى قبل الزخرفة</text>

    <g transform="translate(704 224) scale(.48)">
      <path d="M-90 112 A145 145 0 1 1 90 112" fill="none" stroke="#0F1F1D" stroke-width="28" stroke-linecap="round"/>
      <path d="M-42 76 A92 92 0 0 1 -42 -76" fill="none" stroke="#91A79D" stroke-width="26" stroke-linecap="round"/>
      <path d="M42 -76 A92 92 0 0 1 42 76" fill="none" stroke="#DD776A" stroke-width="26" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="22" fill="#0F1F1D"/>
      <circle cx="96" cy="-92" r="13" fill="#6087A0"/>
    </g>

    <g transform="translate(840 162)">
      <text x="0" y="0" fill="#0F1F1D" font-family="Arial, sans-serif" font-size="12">لوحة الألوان المعتمدة</text>
      <rect x="0" y="22" width="50" height="50" rx="6" fill="#0F1F1D"/>
      <rect x="60" y="22" width="50" height="50" rx="6" fill="#F2EFE7" stroke="#D8D2C8"/>
      <rect x="120" y="22" width="50" height="50" rx="6" fill="#91A79D"/>
      <rect x="180" y="22" width="50" height="50" rx="6" fill="#DD776A"/>
      <rect x="240" y="22" width="50" height="50" rx="6" fill="#6087A0"/>
      <text x="0" y="98" fill="#6087A0" font-family="Arial, sans-serif" font-size="10">#0F1F1D</text>
      <text x="120" y="98" fill="#6087A0" font-family="Arial, sans-serif" font-size="10">#91A79D</text>
      <text x="240" y="98" fill="#6087A0" font-family="Arial, sans-serif" font-size="10">#6087A0</text>
    </g>
  </g>

  <!-- Digital application -->
  <g filter="url(#shadow)">
    <rect x="532" y="356" width="286" height="390" rx="4" fill="#F2EFE7"/>
    <text x="566" y="397" fill="#4C6B61" font-family="Arial, sans-serif" font-size="13">التطبيق الرقمي</text>
    <rect x="570" y="420" width="210" height="288" rx="30" fill="#0F1F1D"/>
    <circle cx="595" cy="448" r="5" fill="#91A79D"/>
    <text x="620" y="452" fill="#F2EFE7" font-family="Arial, sans-serif" font-size="12">صباح الخير، نورة</text>
    <text x="595" y="490" fill="#91A79D" font-family="Arial, sans-serif" font-size="11">مؤشر العافية اليوم</text>
    <text x="595" y="552" fill="#F2EFE7" font-family="Arial, sans-serif" font-size="62">78</text>
    <text x="670" y="543" fill="#91A79D" font-family="Arial, sans-serif" font-size="11">متوازن</text>
    <rect x="594" y="578" width="148" height="10" rx="5" fill="#91A79D"/>
    <rect x="594" y="603" width="120" height="10" rx="5" fill="#6087A0"/>
    <rect x="594" y="628" width="132" height="10" rx="5" fill="#DD776A"/>
    <rect x="594" y="653" width="101" height="10" rx="5" fill="#91A79D"/>
  </g>

  <!-- Report / membership -->
  <g filter="url(#shadow)">
    <rect x="850" y="356" width="296" height="390" rx="4" fill="#0F1F1D" stroke="#91A79D" stroke-opacity=".28"/>
    <text x="884" y="397" fill="#F2EFE7" font-family="Arial, sans-serif" font-weight="700" font-size="20">تقرير العافية</text>
    <text x="884" y="420" fill="#91A79D" font-family="Arial, sans-serif" font-size="11" letter-spacing="3">WEEK 24</text>
    <rect x="884" y="452" width="228" height="66" rx="10" fill="#17312D"/>
    <text x="900" y="478" fill="#F2EFE7" font-family="Arial, sans-serif" font-size="12">الملخص</text>
    <text x="900" y="500" fill="#91A79D" font-family="Arial, sans-serif" font-size="10">تحسن الاتجاه العام مع ثبات الحركة والتغذية.</text>
    <rect x="884" y="534" width="228" height="82" rx="10" fill="#17312D"/>
    <text x="900" y="560" fill="#F2EFE7" font-family="Arial, sans-serif" font-size="12">الخطوة التالية</text>
    <text x="900" y="584" fill="#DD776A" font-family="Arial, sans-serif" font-size="11">ثبّت وقت الاستيقاظ 7:00</text>
    <rect x="884" y="640" width="104" height="68" rx="8" fill="#91A79D"/>
    <text x="936" y="670" text-anchor="middle" fill="#0F1F1D" font-family="Arial, sans-serif" font-weight="700" font-size="12">دفتر الاتزان</text>
    <text x="936" y="690" text-anchor="middle" fill="#0F1F1D" font-family="Arial, sans-serif" font-size="9">WEEKLY JOURNAL</text>
    <rect x="1002" y="640" width="110" height="68" rx="8" fill="#F2EFE7"/>
    <circle cx="1025" cy="664" r="7" fill="#DD776A"/>
    <text x="1048" y="668" fill="#0F1F1D" font-family="Arial, sans-serif" font-size="11">عضوية سنوية</text>
    <text x="1048" y="690" fill="#6087A0" font-family="Arial, sans-serif" font-size="9">WIZAN</text>
  </g>

  <text x="1138" y="776" text-anchor="end" fill="#91A79D" font-family="Arial, sans-serif" font-size="11" letter-spacing="3">CREATED BY ATHRBRANDS</text>
</svg>